<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>몰랑이네 동네</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png" type="image/png">
<!-- iOS 는 **SVG 를 안 받는다.** PNG 만 받아서, 전에는 글자만 떴다. -->
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="몰랑이네">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fdf6e6">
<meta name="theme-color" content="#211c18" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
  /* 색은 **그림에서 뽑았다.** 소풍 그림의 하늘·풀·돗자리·볼,
     그리고 무엇보다 **굵은 갈색 테두리.** 그 선이 몰랑이 그림체의
     서명이라, 화면도 그 선을 물려받는다. */
  :root{
    color-scheme: light;
    --paper:#fdf6e6; --card:#fffdf5;
    --ink:#5a4034; --dim:#9c8878;
    --line:#7a5c48;        /* 그림의 그 갈색 — 아껴 쓴다 */
    --soft:#e8d9bf;        /* 카드 테두리 */
    --sky:#d5e8e6; --grass:#c3dc9c; --butter:#f8dd93; --peach:#f3bfa9;
    --pop:0 3px 0 rgba(122,92,72,.16);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing:border-box;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --paper:#211c18; --card:#2c2621;
      --ink:#f0e3d2; --dim:#9c8a78;
      --line:#8a6e58; --soft:#3f352c;
      --sky:#2a3a3a; --grass:#2f3a28; --butter:#4d3f22; --peach:#4a332c;
      --pop:0 3px 0 rgba(0,0,0,.28);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Gowun Dodum",-apple-system,"Apple SD Gothic Neo",
                "Noto Sans KR",sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:16px 14px 28px; line-height:1.55;
  }
  h1,h2,h3,nav button{font-family:"Jua",inherit;font-weight:400}

  header{
    width:100%;max-width:560px;margin-bottom:14px;
    display:flex;align-items:center;gap:12px;
  }
  /* 아이콘을 머리에 둔다 — 들여다보는 창이라는 걸 그림이 먼저 말한다 */
  header img{
    width:52px;height:52px;border-radius:16px;flex:0 0 auto;
    border:2px solid var(--line);box-shadow:var(--pop);
  }
  h1{font-size:1.3rem;margin:0;letter-spacing:.01em;line-height:1.2}
  .sub{font-size:.8rem;color:var(--dim);margin-top:2px}

  /* 지도에 **굵은 선**을 몰아준다. 대담함은 한 군데만. */
  .map{
    width:100%;max-width:560px;background:var(--card);
    border:2.5px solid var(--line);border-radius:22px;padding:10px;
    box-shadow:var(--pop);
    overflow-x:auto;
  }
  .grid{display:grid;gap:1px;min-width:320px}
  .wrap{position:relative}
  .wrap canvas{position:absolute;inset:0;width:100%;height:100%;
               pointer-events:none;border-radius:10px}
  .grid{position:relative;z-index:1}
  .cell{
    aspect-ratio:1;border-radius:4px;
    display:flex;align-items:center;justify-content:center;
    font-size:min(3.4vw,15px);position:relative;
  }
  .cell{border-radius:7px}
  .cell.spot{
    cursor:pointer;
    background:var(--card);
    box-shadow:0 0 0 1.5px var(--line), 0 2px 0 rgba(122,92,72,.18);
  }
  .cell.spot:active{transform:translateY(1px) scale(.95)}
  .cell.here{background:var(--butter);
             box-shadow:0 0 0 2.5px var(--line), 0 2px 0 rgba(122,92,72,.3)}
  .who{
    position:absolute;bottom:-2px;right:-1px;
    font-size:min(2.6vw,11px);line-height:1;
    text-shadow:0 0 3px var(--card),0 0 3px var(--card);
  }

  .legend{
    width:100%;max-width:560px;margin-top:10px;
    display:flex;flex-wrap:wrap;gap:6px 12px;
    font-size:.72rem;color:var(--dim);
  }
  .legend b{color:var(--ink)}

  .bar{
    width:100%;max-width:560px;margin-top:14px;
    display:flex;align-items:center;gap:10px;
  }
  button{
    background:var(--card);color:var(--ink);
    border:2px solid var(--soft);border-radius:12px;
    padding:8px 14px;font-size:.84rem;cursor:pointer;
    font-family:inherit;box-shadow:var(--pop);
  }
  button:active{transform:translateY(2px);box-shadow:none}
  button:focus-visible{outline:2.5px solid var(--line);outline-offset:2px}
  input[type=range]{flex:1;accent-color:#d8a85e}
  .time{font-size:.78rem;color:var(--dim);min-width:70px;text-align:right;
        font-variant-numeric:tabular-nums}

  .panel{
    width:100%;max-width:560px;margin-top:14px;
    background:var(--card);border:2px solid var(--soft);
    border-radius:18px;padding:14px 16px;font-size:.86rem;
    box-shadow:var(--pop);position:relative;
  }
  .panel h2{font-size:1rem;margin:0 0 8px;padding-right:30px}
  .panel .row{color:var(--dim);margin:4px 0}
  .panel .row b{color:var(--ink)}
  .shut{
    position:absolute;top:8px;right:10px;padding:2px 9px;
    font-size:.9rem;border-radius:999px;box-shadow:none;color:var(--dim);
  }
  .hide{display:none}
  footer{margin-top:18px;font-size:.76rem;color:var(--dim);text-align:center}

  /* 탭 — **보는 것만** 여기 모은다. 대화와 승인은 그대로 Streamlit 에.
     가로로 흐르게 두면 오른쪽 칸을 누를 때 줄이 밀려서 '동네' 가
     화면 밖으로 나간다. 실제로 390px 에서 74px 넘쳤다.
     **줄바꿈해서 여섯 개가 늘 다 보이게** 한다. */
  nav{
    width:100%;max-width:560px;display:flex;flex-wrap:wrap;
    gap:7px;margin-bottom:14px;
  }
  nav button{
    flex:0 0 auto;border-radius:999px;padding:7px 14px;
    font-size:.86rem;color:var(--dim);
    border-color:var(--soft);box-shadow:none;
  }
  nav button.on{
    color:var(--ink);background:var(--butter);
    border-color:var(--line);box-shadow:var(--pop);
  }

  section{width:100%;max-width:560px;display:flex;flex-direction:column;
          align-items:center}
  /* 탭을 누른 뒤 내용이 **살짝 떠오른다.** 사람이 누른 것에 대한
     대답이라 괜찮다. 가만있는 화면이 스스로 움직이지는 않는다. */
  section:not(.hide){animation:rise .18s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(5px)}}
  @media (prefers-reduced-motion:reduce){
    section:not(.hide){animation:none}
    button:active{transform:none}
  }

  .card{
    width:100%;background:var(--card);border:2px solid var(--soft);
    border-radius:18px;padding:14px 16px;font-size:.86rem;
    margin-bottom:12px;box-shadow:var(--pop);
  }
  .card h3{font-size:1rem;margin:0 0 10px}
  .line{display:flex;align-items:center;gap:9px;margin:8px 0}
  .line .nm{min-width:84px}
  .meter{flex:1;height:9px;border-radius:99px;background:var(--paper);
         overflow:hidden;border:1.5px solid var(--soft)}
  .meter i{display:block;height:100%;background:var(--peach)}
  .num{font-size:.76rem;color:var(--dim);
       font-variant-numeric:tabular-nums;min-width:58px;text-align:right}
  .quote{margin:8px 0}
  .muted{color:var(--dim);margin:6px 0}
  .tag{display:inline-block;background:var(--sky);border-radius:999px;
       padding:2px 9px;font-size:.74rem;color:var(--ink);margin-right:5px}
  /* 들은 말·꺼낸 근거는 **옮겨 적은 것**이라, 공책 여백선을 둔다 */
  .src{color:var(--dim);font-size:.8rem;margin:5px 0;
       border-left:3px solid var(--grass);padding-left:10px}
</style>
</head>
<body>
<header>
  <img src="/icon-192.png" alt="" width="52" height="52">
  <div>
    <h1>몰랑이네 동네</h1>
    <div class="sub" id="sub">문 여는 중이에요…</div>
  </div>
</header>

<nav id="tabs">
  <button data-go="town" class="on">🗺️ 동네</button>
  <button data-go="bonds">🫂 사이</button>
  <button data-go="society">🏘️ 사회</button>
  <button data-go="talks">💬 대화</button>
  <button data-go="dreams">💭 꿈</button>
  <button data-go="evidence">📎 근거</button>
</nav>

<section id="tab-town">
  <div class="map"><div class="wrap">
    <canvas id="terrain"></canvas>
    <div class="grid" id="grid"></div>
  </div></div>

  <div class="legend" id="legend"></div>

  <div class="bar">
    <button id="play">▶ 하루 되감기</button>
    <input type="range" id="seek" min="0" max="0" value="0">
    <span class="time" id="time">지금</span>
  </div>

  <div class="panel hide" id="panel">
    <button class="shut" id="shut" aria-label="닫기">✕</button>
    <h2 id="pname"></h2>
    <div id="pbody"></div>
  </div>

  <footer>15분마다 한 걸음씩 움직입니다</footer>
</section>

<section id="tab-bonds" class="hide"></section>
<section id="tab-society" class="hide"></section>
<section id="tab-talks" class="hide"></section>
<section id="tab-dreams" class="hide"></section>
<section id="tab-evidence" class="hide"></section>

<script>
const API = "/api/world";          // 같은 Vercel 배포의 함수
let world = null, frames = [], idx = -1, timer = null;

const EMO_ = {"몰랑이":"🐰","피우피우":"🐤","슈야":"🧁","토야":"🍫","미피":"🍼"};
// 핀코는 여럿이다 — 어부 핀코, 나무꾼 핀코, 별지기 핀코…
const EMO = new Proxy(EMO_, {get:(o,k)=>
  o[k] || (typeof k === "string" && k.includes("핀코") ? "🧑‍🌾" : undefined)});

async function load(){
  try{
    const r = await fetch(API);
    const d = await r.json();
    if(d.error) throw new Error(d.error);
    world = d.view; frames = (d.replay && d.replay.frames) || [];
    renderAll();
    const seek = document.getElementById("seek");
    seek.max = Math.max(0, frames.length - 1);
    seek.value = seek.max;
    idx = -1;                       // -1 이면 '지금'
    draw(null);
    const n = Object.keys(world.spots).length;
    document.getElementById("sub").textContent = frames.length
      ? `자리 ${n}곳, 어제 하루가 ${frames.length}장면 남아 있어요`
      : `자리 ${n}곳이 생겼어요`;
  }catch(e){
    // 왜 안 됐는지 화면에 적는다 — 조용히 실패하면 고칠 수가 없다
    document.getElementById("sub").textContent =
      "아직 문이 안 열려요 — " + (e && e.message ? e.message : e);
  }
}

function whoAt(frame){
  // frame 이 null 이면 '지금'
  const out = {};
  const src = frame ? frame.who : world.who;
  for(const [n, v] of Object.entries(src || {})){
    const spot = v.spot || v.at;
    if(!spot) continue;
    (out[spot] = out[spot] || []).push({name:n, room:v.room, feel:v.feel});
  }
  return out;
}

// 자리마다 땅의 결이 있다. 둘레로 번져서 지형이 된다.
const SOIL = {
  "바다":[74,134,170], "물가":[88,142,166], "숲":[82,128,76],
  "들판":[168,178,96], "산":[138,128,114], "언덕마루":[160,158,102],
  "꽃길":[192,128,152], "밤하늘터":[94,96,150], "메아리벽":[130,126,116],
  "폐허":[138,126,112], "안개골":[152,152,152], "꽃밭":[196,136,160],
};
const VILLAGE_SOIL = [188,162,124];     // 마을은 흙빛

function soilOf(name, zone){
  return SOIL[name] || (zone === "village" ? VILLAGE_SOIL : [150,160,130]);
}

function paintTerrain(){
  // **칸마다 가장 가까운 자리의 색.**
  //
  // 번지게 하면 열여섯 자리가 서로 섞여 뿌예진다. 가장 가까운
  // 자리의 색을 칠하면 **바다 쪽, 숲 쪽이 구역으로 갈려** 보인다.
  // 그래야 지도답다. 경계에서만 조금 섞어 칼로 자른 느낌을 던다.
  //
  // 없는 강이나 해안선은 그리지 않는다 — 자료에 있는 자리만 쓴다.
  const cv = document.getElementById("terrain");
  const g = document.getElementById("grid");
  const [W,H] = world.size;
  const rect = g.getBoundingClientRect();
  if(!rect.width) return;
  const px = Math.max(2, Math.round(rect.width / W));
  cv.width = W * px; cv.height = H * px;
  const ctx = cv.getContext("2d");
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;

  const seeds = Object.entries(world.spots).map(([n,s]) =>
    ({x:s.xy[0], y:s.xy[1], c:soilOf(n, s.zone)}));
  if(!seeds.length){ ctx.clearRect(0,0,cv.width,cv.height); return; }

  const img = ctx.createImageData(cv.width, cv.height);
  // 바탕을 **종이색**과 같은 결로 둔다. 회색에 섞으면 땅이 식는다.
  const mix = 0.5, base = dark ? [38,32,26] : [253,246,230];
  for(let py=0; py<cv.height; py++){
    for(let pxx=0; pxx<cv.width; pxx++){
      const gx = pxx/px - 0.5, gy = py/px - 0.5;
      let best=null, bd=1e9, second=null, sd=1e9;
      for(const s of seeds){
        const d = (s.x-gx)**2 + (s.y-gy)**2;
        if(d < bd){ sd=bd; second=best; bd=d; best=s; }
        else if(d < sd){ sd=d; second=s; }
      }
      let [r,g2,b] = best.c;
      if(second){
        // 두 자리가 비슷하게 가까우면 그 사이를 부드럽게
        const t = Math.max(0, Math.min(1,
          (Math.sqrt(sd) - Math.sqrt(bd)) / 0.9));
        const k = (1-t) * 0.5;
        r = r*(1-k) + second.c[0]*k;
        g2 = g2*(1-k) + second.c[1]*k;
        b = b*(1-k) + second.c[2]*k;
      }
      const i = (py*cv.width + pxx)*4;
      img.data[i]   = base[0]*(1-mix) + r*mix;
      img.data[i+1] = base[1]*(1-mix) + g2*mix;
      img.data[i+2] = base[2]*(1-mix) + b*mix;
      img.data[i+3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  paintPaths(ctx, px);
}

function paintPaths(ctx, px){
  // **길.** 자주 오간 사이는 땅에 자국이 남는다.
  const paths = world.paths || [];
  if(!paths.length) return;
  const s = world.spots;
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const most = Math.max(...paths.map(p => p.n), 1);
  ctx.lineCap = "round";
  for(const p of paths){
    const a = s[p.a], b = s[p.b];
    if(!a || !b) continue;
    const t = p.n / most;
    // 전에는 거의 안 보였다. 자주 오간 자국이 보여야 길이다.
    ctx.strokeStyle = dark ? `rgba(235,222,200,${0.14 + t*0.26})`
                           : `rgba(92,72,48,${0.14 + t*0.28})`;
    ctx.lineWidth = px * (0.12 + t*0.30);
    ctx.beginPath();
    ctx.moveTo((a.xy[0]+0.5)*px, (a.xy[1]+0.5)*px);
    ctx.lineTo((b.xy[0]+0.5)*px, (b.xy[1]+0.5)*px);
    ctx.stroke();
  }
}

function draw(frame){
  if(!world) return;
  const [W,H] = world.size;
  const g = document.getElementById("grid");
  g.style.gridTemplateColumns = `repeat(${W},1fr)`;
  const at = {};
  for(const [name,s] of Object.entries(world.spots)) at[s.xy.join(",")] = [name,s];
  const here = whoAt(frame);

  g.innerHTML = "";
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const c = document.createElement("div");
    const hit = at[`${x},${y}`];
    if(!hit){ c.className = "cell empty"; g.appendChild(c); continue; }
    const [name,s] = hit;
    const people = here[name] || [];
    c.className = `cell spot ${s.zone}` + (people.length ? " here" : "");
    c.textContent = s.icon;
    c.title = name;
    if(people.length){
      const w = document.createElement("span");
      w.className = "who";
      w.textContent = people.map(p => EMO[p.name] || "🐾").join("");
      c.appendChild(w);
    }
    c.onclick = () => show(name, s, people);
    g.appendChild(c);
  }
  legend();
  requestAnimationFrame(paintTerrain);
}

addEventListener("resize", () => world && paintTerrain());

function legend(){
  const el = document.getElementById("legend");
  const names = Object.keys(world.who || {});
  el.innerHTML = names.map(n =>
    `<span>${EMO[n]||"🐾"} <b>${n}</b></span>`).join("");
}

function show(name, s, people){
  const p = document.getElementById("panel");
  p.classList.remove("hide");
  document.getElementById("pname").textContent = `${s.icon} ${name}`;
  const rows = [];
  if(people.length){
    rows.push(`<div class="row">지금 여기: <b>${
      people.map(x => `${EMO[x.name]||""}${x.name}${
        x.room ? ` (${x.room})` : ""}`).join(", ")}</b></div>`);
    for(const x of people) if(x.feel)
      rows.push(`<div class="row">${x.name} — ${x.feel}</div>`);
  } else {
    rows.push(`<div class="row">아무도 없어요</div>`);
  }
  if(s.zone === "land" && s.dist)
    rows.push(`<div class="row">집에서 <b>${s.dist}</b>만큼 멀어요</div>`);
  if(world.pinko){
    const pk = Object.entries(world.pinko).find(([k]) => k === name);
    if(pk) rows.push(`<div class="row">🧑‍🌾 <b>${pk[1]}</b>가 여기 살아요</div>`);
  }
  // 몰랑이네는 안을 보여준다
  if(name === "몰랑이네" && world.home)
    rows.push(houseHTML());
  document.getElementById("pbody").innerHTML = rows.join("");
}

function houseHTML(){
  const h = world.home || {};
  const coords = h.coords || {};
  const objs = h.objects || {};
  const where = h.where || {};
  const inv = {};
  for(const [k,v] of Object.entries(where))
    inv[v] = (inv[v]||[]).concat(k === "molang" ? "🐰" : "🐤");
  let xs = [], ys = [];
  for(const [,xy] of Object.entries(coords)){ xs.push(xy[1]); ys.push(xy[0]); }
  if(!xs.length) return "";
  const W = Math.max(...xs)+1, H = Math.max(...ys)+1;
  const cell = {};
  for(const [room,xy] of Object.entries(coords)) cell[`${xy[0]},${xy[1]}`] = room;
  let out = `<div class="row" style="margin-top:8px">집 안</div>`;
  out += `<div style="display:grid;gap:3px;grid-template-columns:repeat(${W},1fr);
           max-width:260px;margin-top:4px">`;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const room = cell[`${y},${x}`];
    if(!room){ out += `<div></div>`; continue; }
    const who = (inv[room]||[]).join("");
    const things = (objs[room]||[]).slice(0,2).join(", ");
    out += `<div style="background:var(--dirt);border-radius:7px;padding:5px 3px;
             text-align:center;font-size:.66rem;line-height:1.3">
             <div style="font-weight:550">${room}</div>
             ${who ? `<div style="font-size:.85rem">${who}</div>` : ""}
             ${things ? `<div style="color:var(--dim);font-size:.6rem">${things}</div>` : ""}
            </div>`;
  }
  out += `</div>`;
  return out;
}

// ── 탭 ───────────────────────────────────────────────────────────
//
// **보는 것만 옮긴다.** 대화와 승인은 Streamlit 에 그대로 둔다.
// 여기서 몰랑이를 부르려면 유형 고르기·트리 걷기·기억 꺼내기·가드가
// 다 있어야 하는데 그건 엔진 쪽에만 있다. 따로 부르면 기억은 같은
// 곳에 남아도 **그 기억을 만든 길이 둘로 갈린다.**

const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function go(name){
  for(const b of document.querySelectorAll("#tabs button"))
    b.classList.toggle("on", b.dataset.go === name);
  for(const id of ["town","bonds","society","talks","dreams","evidence"])
    document.getElementById("tab-"+id).classList.toggle("hide", id !== name);
  // 지형은 칸 너비를 재서 그린다. 숨어 있을 땐 0 이라 안 그려진다.
  if(name === "town" && world) requestAnimationFrame(paintTerrain);
  // 긴 목록을 보다가 탭을 바꾸면 중간에 떨어진다 — 늘 머리부터.
  scrollTo({top:0, behavior:"instant"});
}
document.getElementById("shut").onclick = () =>
  document.getElementById("panel").classList.add("hide");
for(const b of document.querySelectorAll("#tabs button"))
  b.onclick = () => go(b.dataset.go);

function renderAll(){
  renderBonds();
  renderSociety();
  renderTalks();
  renderDreams();
  renderEvidence();
}

const when = s => s ? new Date(s).toLocaleString("ko-KR",
  {month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}) : "";

function bondLines(rows){
  const most = Math.max(...rows.map(r => +r.level || 0), 1);
  return rows.map(r => {
    const lv = +r.level || 0;
    return `<div class="line">
      <span class="nm">${EMO[r.who]||"🐾"} ${esc(r.who)}</span>
      <span class="meter"><i style="width:${
        Math.round(Math.min(1, lv/most)*100)}%"></i></span>
      <span class="num">${lv.toFixed(2)} ${r.times||0}번</span>
    </div>` + ((r.topics||[]).length
      ? `<div class="muted" style="margin:-2px 0 8px 76px">${
          r.topics.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>`
      : "");
  }).join("");
}

function renderBonds(){
  const el = document.getElementById("tab-bonds");
  const b = (world && world.bonds) || {};
  const mine = b.mine || [], others = b.others || [];
  if(!mine.length && !others.length){
    el.innerHTML = `<div class="card"><h3>🫂 사이</h3>
      <div class="muted">아직 쌓인 사이가 없어요.<br>
      밤 워커가 돌고 나면 여기에 보여요.</div></div>`;
    return;
  }
  let out = "";
  if(mine.length) out += `<div class="card">
    <h3>🫂 몰랑이와 가까운 사이</h3>${bondLines(mine)}
    <div class="muted" style="margin-top:8px">
      함께 있던 횟수가 쌓이면 짙어지고, 한참 안 보면 옅어져요.</div></div>`;
  if(others.length) out += `<div class="card">
    <h3>몰랑이 없이 맺어진 사이</h3>${bondLines(others)}
    <div class="muted" style="margin-top:8px">
      이웃들끼리 만나서 생긴 사이예요. 몰랑이는 거기 없었어요.</div></div>`;
  el.innerHTML = out;
}

// ── 대화 ─────────────────────────────────────────────────────────
//
// 여행 중 나눈 말이 따로 저장되는 게 아니라, **자리로 드러난다.**
// 그때 어디 있었는지가 place 에 남아서, 호텔·산길이면 여행 중이다.

function renderTalks(){
  const el = document.getElementById("tab-talks");
  const peer = (world && world.peer) || [];
  const mine = (world && world.talks) || [];
  let out = "";

  if(peer.length){
    out += `<div class="card"><h3>🐤 피우피우와 나눈 말</h3>
      <div class="muted">몰랑이가 먼저 말하고, 피우피우가 받아요.
        자리가 적혀 있으면 그때 거기 있었던 거예요.</div></div>`;
    out += peer.map(t => `<div class="card">
      <div class="muted">
        ${t.place ? `<span class="tag">📍 ${esc(t.place)}</span>` : ""}
        ${t.topic ? `<span class="tag">${esc(t.topic)}</span>` : ""}
        ${when(t.at)}</div>
      <div class="quote"><b>🐰</b> ${esc(t.molang)}</div>
      <div class="quote" style="color:var(--dim)"><b>🐤</b> ${esc(t.piupiu)}</div>
    </div>`).join("");
  }

  if(mine.length){
    out += `<div class="card" style="margin-top:14px">
      <h3>💬 나와 나눈 말</h3></div>`;
    out += mine.map(t => `<div class="card">
      <div class="muted">
        ${t.place ? `<span class="tag">📍 ${esc(t.place)}</span>` : ""}
        ${t.emotion ? `<span class="tag">${esc(t.emotion)}</span>` : ""}
        ${when(t.at)}</div>
      <div class="quote" style="color:var(--dim)">${esc(t.q)}</div>
      <div class="quote"><b>🐰</b> ${esc(t.a)}</div>
    </div>`).join("");
  }

  el.innerHTML = out || `<div class="card"><h3>💬 대화</h3>
    <div class="muted">아직 쌓인 대화가 없어요.</div></div>`;
}

// ── 꿈 ───────────────────────────────────────────────────────────
//
// 꿈은 **겪은 것을 섞어** 만든다. pieces 가 그 재료라 같이 보여준다.
// 어디서 왔는지 보이면, 지어낸 말과 겪은 것의 자리가 갈린다.

function renderDreams(){
  const el = document.getElementById("tab-dreams");
  const rows = (world && world.dreams) || [];
  if(!rows.length){
    el.innerHTML = `<div class="card"><h3>💭 꿈</h3>
      <div class="muted">아직 꾼 꿈이 없어요.<br>
      밤에 쌓인 게 많아야 꿔요 — 적으면 그냥 자요.</div></div>`;
    return;
  }
  el.innerHTML = `<div class="card"><h3>💭 꾼 꿈</h3>
    <div class="muted">겪은 것을 섞어서 꿔요. 아래 낱말이 그 재료예요.
      </div></div>` + rows.map(d => `<div class="card">
    <div class="muted">
      ${d.feel ? `<span class="tag">${esc(d.feel)}</span>` : ""}
      ${when(d.at)}</div>
    <div class="quote" style="line-height:1.6">${esc(d.text)}</div>
    <div class="muted" style="margin-top:8px">
      ${(d.pieces||[]).map(p => `<span class="tag">${esc(p)}</span>`).join("")}
      ${d.linger ? `· 남은 낱말 <b style="color:var(--ink)">${
        esc(d.linger)}</b>` : ""}</div>
  </div>`).join("");
}

function renderSociety(){
  const el = document.getElementById("tab-society");
  const s = (world && world.society) || {};
  const parts = [];

  parts.push(`<div class="card">
    <h3>🏘️ 이웃들끼리</h3>
    <div class="muted">몰랑이가 없어도 이웃들은 서로 마주치고,
      관심을 옮기고, 그 말이 동네에 남아요.</div>
    <div class="line" style="margin-top:10px">
      <span class="nm">마주침</span>
      <span class="num" style="min-width:auto">${s.n_meets || 0}번</span>
    </div>
  </div>`);

  if((s.where || []).length)
    parts.push(`<div class="card"><h3>어디서 자주 마주쳤나</h3>
      ${s.where.map(([p,n]) =>
        `<div class="line"><span class="nm">${esc(p)}</span>
         <span class="num" style="min-width:auto">${n}번</span></div>`).join("")}
    </div>`);

  if((s.last || []).length)
    parts.push(`<div class="card"><h3>최근 마주침</h3>
      ${s.last.map(m => `<div class="muted">
        <b style="color:var(--ink)">${esc(m.a)}</b> ·
        <b style="color:var(--ink)">${esc(m.b)}</b>
        ${m.place ? `<span class="tag">${esc(m.place)}</span>` : ""}
        ${m.topic ? esc(m.topic) : ""}</div>`).join("")}
    </div>`);

  // 소문은 **누가 들었는지**가 핵심이다. 같은 말이라도 들은 사람이
  // 다르면 다른 기억이 된다.
  if((s.rumors || []).length)
    parts.push(`<div class="card"><h3>떠도는 말</h3>
      ${s.rumors.map(r => `
        <div class="muted" style="margin-top:8px">
          ${EMO[r.who]||"🐾"} <b style="color:var(--ink)">${esc(r.who)}</b>가 들은 말</div>
        ${r.lines.map(t => `<div class="src">${esc(t)}</div>`).join("")}
      `).join("")}
      <div class="muted" style="margin-top:10px">
        들은 말은 사실로 바로 쌓이지 않아요. 0.35 로 시작해요.</div>
    </div>`);

  if(parts.length === 1)
    parts.push(`<div class="card"><div class="muted">
      아직 마주친 기록이 없어요.</div></div>`);

  el.innerHTML = parts.join("");
}

function renderEvidence(){
  const el = document.getElementById("tab-evidence");
  const rows = (world && world.evidence) || [];
  if(!rows.length){
    el.innerHTML = `<div class="card"><h3>📎 근거</h3>
      <div class="muted">아직 기록이 없어요.<br>
      대화를 하면 그때 무엇을 꺼내 봤는지 여기 쌓여요.</div></div>`;
    return;
  }
  const with_src = rows.filter(r => r.n > 0).length;
  el.innerHTML = `<div class="card">
    <h3>📎 무엇을 꺼내 보고 말했나</h3>
    <div class="muted">최근 ${rows.length}번 중 근거를 꺼낸 것
      <b style="color:var(--ink)">${with_src}번</b>.
      점수는 매기지 않아요 — 있는 그대로 봅니다.</div>
  </div>` + rows.map(r => `<div class="card">
    <div class="muted"><span class="tag">${esc(r.type || "?")}</span>
      ${r.at ? new Date(r.at).toLocaleString("ko-KR",
        {month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}) : ""}
    </div>
    ${r.n ? r.sources.map(x => `<div class="src">${esc(x)}</div>`).join("")
          : `<div class="muted">꺼낼 근거가 없었어요</div>`}
  </div>`).join("");
}

document.getElementById("seek").oninput = e => {
  const i = +e.target.value;
  idx = i;
  draw(frames[i] || null);
  const f = frames[i];
  document.getElementById("time").textContent = f
    ? new Date(f.at*1000).toLocaleTimeString("ko-KR",
        {hour:"2-digit",minute:"2-digit"})
    : "지금";
};

document.getElementById("play").onclick = () => {
  const btn = document.getElementById("play");
  if(timer){ clearInterval(timer); timer=null; btn.textContent="▶ 하루 되감기"; return; }
  if(!frames.length) return;
  btn.textContent = "⏸ 멈춤";
  let i = 0;
  timer = setInterval(() => {
    const seek = document.getElementById("seek");
    seek.value = i;
    seek.dispatchEvent(new Event("input"));
    if(++i >= frames.length){ clearInterval(timer); timer=null;
      btn.textContent="▶ 하루 되감기"; }
  }, 420);
};

load();
setInterval(load, 5 * 60 * 1000);   // 5분마다 새로 읽는다
</script>
</body>
</html>
